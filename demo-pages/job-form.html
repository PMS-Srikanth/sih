<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Fern &amp; Co — Candidate Registration</title>
<style>
  :root { --bg:#fbfaf7; --card:#fff; --line:#e6e2d9; --ink:#232019; --ink2:#6b6558; --acc:#7a5c2e; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
    font:15px/1.55 Georgia, "Times New Roman", serif; }
  header { background:var(--acc); color:#fff; padding:20px 34px; }
  header .brand { font:700 13px/1 "Segoe UI",system-ui,sans-serif; letter-spacing:.22em; text-transform:uppercase; }
  header h1 { margin:8px 0 0; font-size:21px; font-weight:400; }
  .wrap { max-width:820px; margin:26px auto 90px; padding:0 20px;
    display:flex; flex-direction:column; gap:18px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:4px; padding:24px 28px; }
  h2 { font-size:16px; margin:0 0 3px; font-weight:400; }
  .muted { color:var(--ink2); font-size:13px; margin:0 0 18px; font-style:italic; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:15px 20px; }
  .full { grid-column:1/-1; }
  label { display:block; font:600 11px/1 "Segoe UI",system-ui,sans-serif;
    letter-spacing:.07em; text-transform:uppercase; color:var(--ink2); margin-bottom:6px; }
  input, textarea, select { width:100%; padding:9px 11px; border:1px solid var(--line);
    border-radius:3px; font:inherit; background:#fff; color:var(--ink); }
  input:focus, textarea:focus, select:focus { outline:2px solid var(--acc); outline-offset:1px; border-color:transparent; }
  textarea { resize:vertical; min-height:88px; }
  button { padding:11px 22px; border-radius:3px; border:1px solid var(--acc);
    background:var(--acc); color:#fff; font:600 14px "Segoe UI",system-ui,sans-serif; cursor:pointer; }
  button.alt { background:#fff; color:var(--ink); border-color:var(--line); }
  .row { display:flex; gap:10px; }
  footer { color:var(--ink2); font-size:12px; text-align:center; padding:0 20px 40px; font-style:italic; }
  #toast { position:fixed; left:50%; bottom:28px; transform:translate(-50%,14px); opacity:0;
    background:var(--ink); color:#fff; padding:11px 20px; border-radius:4px;
    font:600 14px "Segoe UI",system-ui,sans-serif; pointer-events:none;
    transition:opacity .18s, transform .18s; }
  #toast.on { opacity:1; transform:translate(-50%,0); }
</style>
</head>
<body>

<header>
  <div class="brand">Fern &amp; Co</div>
  <h1>Candidate registration</h1>
</header>

<div class="wrap">

  <div class="card">
    <h2>About this form</h2>
    <p class="muted">A blank third-party form — nothing is pre-filled. This is the case the
      local profile exists for.</p>
  </div>

  <form class="card">
    <h2>Your details</h2>
    <p class="muted">Every field below is empty.</p>
    <div class="grid">
      <div>
        <label for="name">Full name</label>
        <input id="name" name="name" autocomplete="name" />
      </div>
      <div>
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" autocomplete="email" />
      </div>
      <div>
        <label for="mobile">Mobile number</label>
        <input id="mobile" name="mobile" type="tel" autocomplete="tel" />
      </div>
      <div>
        <label for="birth">Date of birth</label>
        <input id="birth" name="birth" autocomplete="bday" />
      </div>
      <div class="full">
        <label for="addr">Street address</label>
        <input id="addr" name="addr" autocomplete="street-address" />
      </div>
      <div>
        <label for="pannum">PAN</label>
        <input id="pannum" name="pannum" />
      </div>
      <div>
        <label for="uid">Aadhaar number</label>
        <input id="uid" name="uid" />
      </div>
      <div>
        <label for="vpa">UPI ID</label>
        <input id="vpa" name="vpa" />
      </div>
      <div>
        <label for="pw">Choose a password</label>
        <input id="pw" name="pw" type="password" autocomplete="new-password" />
      </div>
      <div class="full">
        <label for="about">Tell us about yourself</label>
        <textarea id="about" name="about"
          placeholder="A large free-text box. The agent will refuse to write personal data here."></textarea>
      </div>
    </div>
  </form>

  <div class="card">
    <div class="row">
      <button type="button" class="alt" id="save">Save progress</button>
      <button type="button" id="register">Register</button>
    </div>
  </div>

</div>

<footer>Fern &amp; Co is fictional. This page exists to test filling a blank form from local data.</footer>

<div id="toast" role="status" aria-live="polite"></div>
<script>
  const toast = document.getElementById("toast");
  let timer;
  function say(m) {
    toast.textContent = m;
    toast.classList.add("on");
    clearTimeout(timer);
    timer = setTimeout(() => toast.classList.remove("on"), 2200);
  }
  document.getElementById("save").addEventListener("click", () => say("Progress saved."));
  document.getElementById("register").addEventListener("click", () => say("Registered."));
</script>
</body>
</html>
